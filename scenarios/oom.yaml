apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: incident-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom-demo}
  template:
    metadata:
      labels: {app: oom-demo}
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        command: ['python', '-c']
        args:
          - |
            import time
            data = []
            print('worker started, loading dataset into memory', flush=True)
            while True:
                data.append(b'x' * 10_000_000)
                print(f'loaded {len(data) * 10} MB', flush=True)
                time.sleep(0.5)
        resources:
          requests: {memory: 32Mi}
          limits: {memory: 64Mi}